<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Xem Phim Không Quảng Cáo - Vuicliptool</title>
    
    <!-- Meta tags hiển thị khi chia sẻ lên mạng xã hội -->
    <meta property="og:title" id="metaTitle" content="Xem Phim Không Quảng Cáo - Vuicliptool">
    <meta property="og:description" id="metaDesc" content="Thưởng thức video trọn vẹn, không quảng cáo cùng Vuicliptool.">
    <meta property="og:image" id="metaImage" content="logo.svg">
    <meta property="og:url" id="metaUrl" content="">
    <meta property="og:type" content="video.other">

    <!-- Font + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
        }
        .brand img { width: 32px; height: 32px; }
        
        .back-home-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback-box {
            margin-top: 15px;
            text-align: center;
        }
        .direct-btn {
            background: linear-gradient(135deg, #2ed573, #7bed9f);
            color: #111;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
            transition: transform 0.2s;
        }
        .direct-btn:hover { transform: translateY(-2px); }

        .movie-details {
            width: 100%;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .movie-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- HEADER ĐIỀU HƯỚNG -->
    <header class="player-header">
        <a class="brand" href="index.html">
            <img src="logo.svg" alt="Logo"> <strong>Vuicliptool</strong>
        </a>
        <a class="back-home-btn" href="index.html"><i class="fas fa-home"></i> Về Trang Chủ</a>
    </header>

    <!-- KHUNG XEM PHIM CHÍNH -->
    <main class="player-container">
        <div class="video-box" id="videoBox">
            <!-- Iframe chuẩn của Dailymotion -->
            <iframe id="dailymotionIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>

        <!-- Nút dự phòng nếu iframe bị chặn -->
        <div class="fallback-box" id="fallbackBox" style="display: none;">
            <a id="directStreamBtn" href="#" target="_blank" class="direct-btn">
                <i class="fas fa-external-link-alt"></i> Xem trực tiếp trên Dailymotion (Nếu bị lỗi Forbidden)
            </a>
        </div>

        <div class="movie-details">
            <h1 class="movie-title" id="displayTitle">Đang tải thông tin phim...</h1>
            <p style="color: #888; font-size: 14px;">Thưởng thức các bộ phim đặc sắc hoàn toàn miễn phí.</p>
        </div>
    </main>

    <!-- SCRIPT XỬ LÝ LẤY ID VÀ GẮN IFRAME CÓ XÁC THỰC ORIGIN -->
    <script>
        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            if (!videoId) {
                document.getElementById('displayTitle').innerText = "Không tìm thấy mã video!";
                return;
            }

            let movieUrl = `https://www.dailymotion.com/video/${videoId}`;

            try {
                // Tải file movies.json để lấy thông tin tên phim
                let movieRes = await fetch('movies.json');
                let movies = await movieRes.json();
                
                let foundMovie = movies.find(m => m.video.includes(videoId) || (m.download && m.download.includes(videoId)));

                if (foundMovie) {
                    let movieTitle = foundMovie.title;
                    document.getElementById('displayTitle').innerText = movieTitle;
                    document.getElementById('pageTitle').innerText = `Xem phim: ${movieTitle} - Vuicliptool`;
                    document.getElementById('metaTitle').setAttribute('content', `Xem phim: ${movieTitle} - Vuicliptool`);
                    
                    if (foundMovie.video) {
                        movieUrl = foundMovie.video;
                    }

                    if(foundMovie.poster) {
                        let fullPoster = foundMovie.poster.startsWith('http') ? foundMovie.poster : window.location.origin + '/' + foundMovie.poster;
                        document.getElementById('metaImage').setAttribute('content', fullPoster);
                    }
                } else {
                    document.getElementById('displayTitle').innerText = `Phim ID: ${videoId}`;
                }

            } catch (error) {
                console.log("Không đọc được movies.json, dùng ID mặc định.");
                document.getElementById('displayTitle').innerText = `Phim ID: ${videoId}`;
            }

            // Kích hoạt nút dự phòng dẫn đến link gốc
            let fallbackBox = document.getElementById('fallbackBox');
            let directBtn = document.getElementById('directStreamBtn');
            if (fallbackBox && directBtn) {
                directBtn.href = movieUrl;
                fallbackBox.style.display = 'block';
            }

            // Lấy tên miền hiện tại để cấp quyền origin chống lỗi Forbidden
            let currentOrigin = window.location.origin;

            // Gắn đường dẫn nhúng iframe chính thức kèm tham số chống chặn
            let iframeUrl = `https://www.dailymotion.com/video/${videoId}?autoplay=1&origin=${encodeURIComponent(currentOrigin)}`;
            document.getElementById('dailymotionIframe').src = iframeUrl;
        }

        initPlayer();
    </script>
</body>
</html>
