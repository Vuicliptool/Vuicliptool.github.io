<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Xem Phim Không Quảng Cáo - Vuicliptool</title>
    
    <!-- Meta tags hiển thị khi chia sẻ lên mạng xã hội -->
    <meta property="og:title" id="metaTitle" content="Xem Phim Không Quảng Cáo - Vuicliptool">
    <meta property="og:description" id="metaDesc" content="Thưởng thức video trọn vẹn, không quảng cáo cùng Vuicliptool.">
    <meta property="og:image" id="metaImage" content="logo.svg">
    <meta property="og:url" id="metaUrl" content="">
    <meta property="og:type" content="video.other">

    <!-- Font + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
        }
        .brand img { width: 32px; height: 32px; }
        
        .back-home-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .fallback-box {
            margin-top: 15px;
            text-align: center;
        }
        .direct-btn {
            background: linear-gradient(135deg, #1877f2, #4893f5);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
            transition: transform 0.2s;
        }
        .direct-btn:hover { transform: translateY(-2px); }

        .movie-details {
            width: 100%;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .movie-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- HEADER ĐIỀU HƯỚNG -->
    <header class="player-header">
        <a class="brand" href="index.html">
            <img src="logo.svg" alt="Logo"> <strong>Vuicliptool</strong>
        </a>
        <a class="back-home-btn" href="index.html"><i class="fas fa-home"></i> Về Trang Chủ</a>
    </header>

    <!-- KHUNG XEM PHIM CHÍNH -->
    <main class="player-container">
        <div class="video-box" id="videoBox">
            <!-- Iframe chuẩn của Facebook Video Plugin -->
            <iframe id="fbIframe" src="" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
        </div>

        <!-- Nút dự phòng -->
        <div class="fallback-box" id="fallbackBox" style="display: none;">
            <a id="directStreamBtn" href="#" target="_blank" class="direct-btn">
                <i class="fab fa-facebook"></i> Xem trực tiếp trên Facebook (Nếu không load được)
            </a>
        </div>

        <div class="movie-details">
            <h1 class="movie-title" id="displayTitle">Đang tải thông tin phim...</h1>
            <p style="color: #888; font-size: 14px;">Thưởng thức các bộ phim đặc sắc hoàn toàn miễn phí.</p>
        </div>
    </main>

    <!-- SCRIPT XỬ LÝ LẤY LINK FACEBOOK VÀ NHÚNG -->
    <script>
        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v'); // Lưu ý: Tham số 'v' lúc này có thể là mã tùy ý hoặc bạn có thể truyền thẳng link

            try {
                let movieRes = await fetch('movies.json');
                let movies = await movieRes.json();
                
                // Tìm phim theo mã hoặc khớp chuỗi
                let foundMovie = movies.find(m => m.video.includes(videoId) || videoId === "1");

                if (foundMovie) {
                    let movieTitle = foundMovie.title;
                    let fbVideoUrl = foundMovie.video;

                    document.getElementById('displayTitle').innerText = movieTitle;
                    document.getElementById('pageTitle').innerText = `Xem phim: ${movieTitle} - Vuicliptool`;
                    
                    // Kích hoạt nút dự phòng mở link Facebook gốc
                    let fallbackBox = document.getElementById('fallbackBox');
                    let directBtn = document.getElementById('directStreamBtn');
                    if (fallbackBox && directBtn) {
                        directBtn.href = fbVideoUrl;
                        fallbackBox.style.display = 'block';
                    }

                    // Tạo khung nhúng chuẩn của Facebook Plugin
                    // Cấu trúc nhúng video Facebook: https://www.facebook.com/plugins/video.php?href=URL_ENCODE&show_text=false&width=560
                    let encodedUrl = encodeURIComponent(fbVideoUrl);
                    let embedUrl = `https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&width=900&autoplay=true`;
                    
                    document.getElementById('fbIframe').src = embedUrl;
                } else {
                    document.getElementById('displayTitle').innerText = "Không tìm thấy thông tin phim!";
                }

            } catch (error) {
                console.error("Lỗi đọc file:", error);
                document.getElementById('displayTitle').innerText = "Không thể tải dữ liệu phim.";
            }
        }

        initPlayer();
    </script>
</body>
</html>
