<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Xem Phim Không Quảng Cáo - Vuicliptool</title>
    
    <!-- Meta tags hiển thị khi chia sẻ lên mạng xã hội -->
    <meta property="og:title" id="metaTitle" content="Xem Phim Không Quảng Cáo - Vuicliptool">
    <meta property="og:description" id="metaDesc" content="Thưởng thức video trọn vẹn, không quảng cáo cùng Vuicliptool.">
    <meta property="og:image" id="metaImage" content="https://vuicliptool.github.io/logo.svg">
    <meta property="og:url" id="metaUrl" content="https://vuicliptool.github.io/">
    <meta property="og:type" content="video.other">

    <!-- Font + Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tệp CSS chung nếu có, hoặc style trực tiếp cho gọn -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
        }
        .brand img { width: 32px; height: 32px; }
        
        .back-home-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-logo-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 35px;
            height: 35px;
            z-index: 5;
            opacity: 0.85;
            pointer-events: none;
        }

        .video-overlay-banner {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffda79;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 5;
            pointer-events: none;
            border: 1px solid rgba(255, 218, 121, 0.3);
            white-space: nowrap;
        }

        .movie-details {
            width: 100%;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .movie-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .loading-box {
            text-align: center;
            font-size: 16px;
            color: #aaa;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- HEADER ĐIỀU HƯỚNG -->
    <header class="player-header">
        <a class="brand" href="index.html">
            <img src="logo.svg" alt="Logo"> <strong>Vuicliptool</strong>
        </a>
        <a class="back-home-btn" href="index.html"><i class="fas fa-home"></i> Về Trang Chủ</a>
    </header>

    <!-- KHUNG XEM PHIM CHÍNH -->
    <main class="player-container">
        <div class="video-box" id="videoBox">
            <img src="logo.svg" alt="Logo" class="video-logo-overlay">
            <div class="video-overlay-banner">Xem phim không quảng cáo tại vuicliptool.github.io</div>
            
            <!-- Vùng chứa nút hoặc thông điệp xử lý thay thế iframe nếu bị chặn -->
            <div id="playerFallback" class="loading-box" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
                <p id="loadingText" style="margin-bottom: 15px;">Đang chuẩn bị luồng phát không quảng cáo...</p>
                <a id="directWatchBtn" href="#" target="_blank" style="background: #ff4757; color: #fff; text-decoration: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; display: none;">
                    <i class="fas fa-play"></i> Bấm để xem trực tiếp
                </a>
            </div>
        </div>

        <div class="movie-details">
            <h1 class="movie-title" id="displayTitle">Đang tải thông tin phim...</h1>
            <p style="color: #888; font-size: 14px;">Thưởng thức các bộ phim đặc sắc hoàn toàn miễn phí, không bị làm phiền bởi quảng cáo.</p>
        </div>
    </main>

    <!-- SCRIPT XỬ LÝ DỮ LIỆU PHIM -->
    <script>
        async function initPlayerPage() {
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');

            if (!videoId) {
                document.getElementById('displayTitle').innerText = "Không tìm thấy mã video!";
                document.getElementById('loadingText').innerText = "Vui lòng chọn phim từ trang chủ.";
                return;
            }

            try {
                // Tải danh sách phim từ movies.json để lấy thông tin tiêu đề và poster
                let response = await fetch('movies.json');
                let movies = await response.json();
                
                let foundMovie = movies.find(m => m.video.includes(videoId) || m.download.includes(videoId));

                if (foundMovie) {
                    // Cập nhật tiêu đề và thẻ Meta SEO cho đẹp khi chia sẻ
                    document.getElementById('displayTitle').innerText = foundMovie.title;
                    document.getElementById('pageTitle').innerText = `Xem phim: ${foundMovie.title} - Vuicliptool`;
                    document.getElementById('metaTitle').setAttribute('content', `Xem phim: ${foundMovie.title} - Vuicliptool`);
                    document.getElementById('metaDesc').setAttribute('content', `Thưởng thức phim ${foundMovie.title} không quảng cáo.`);
                    if(foundMovie.poster) {
                        let fullPoster = foundMovie.poster.startsWith('http') ? foundMovie.poster : window.location.origin + '/' + foundMovie.poster;
                        document.getElementById('metaImage').setAttribute('content', fullPoster);
                    }
                } else {
                    document.getElementById('displayTitle').innerText = `Phim ID: ${videoId}`;
                }

                // Thiết lập nút chuyển hướng dự phòng thông minh nếu Dailymotion siết chặn iframe
                let watchUrl = `https://www.dailymotion.com/video/${videoId}`;
                let directBtn = document.getElementById('directWatchBtn');
                directBtn.href = watchUrl;
                directBtn.style.display = 'inline-flex';
                document.getElementById('loadingText').innerText = "Trình phát đã sẵn sàng:";

            } catch (error) {
                console.error("Lỗi tải thông tin phim:", error);
                document.getElementById('displayTitle').innerText = "Lỗi kết nối dữ liệu phim.";
            }
        }

        initPlayerPage();
    </script>
</body>
</html>
