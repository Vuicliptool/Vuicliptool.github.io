<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bé Vui Học Tiếng Việt - Bài Học</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b7de9">
  <link rel="stylesheet" href="css/style.css?v=20261115" />
</head>
<body>

  <!-- Phần tử ẩn giữ tương thích ngược nếu trình duyệt còn lưu cache main.js cũ -->
  <span id="topBackBtn" style="display:none;"></span>

  <!-- THANH TIÊU ĐỀ TRANG BÀI HỌC -->
  <header class="app-topbar">
    <a href="index.html" class="back-circle-btn" id="backToHomeBtn" title="Quay lại chọn môn" style="text-decoration:none;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>

    <h1 class="topbar-title" id="topbarTitle">Tập đọc</h1>

    <div class="topbar-right" style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="btn-sm" id="toggleBgmBtn" title="Bật/Tắt nhạc nền">🔊 Nhạc: Bật</button>
      
    </div>
  </header>

  <!-- THANH CHỌN NHANH MÔN HỌC -->
  

  <!-- THANH TÌM KIẾM TRONG LESSONS -->
  <div class="search-section" id="searchSection">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Tìm kiếm bài học..." />
    <button type="button" class="search-circle-btn" id="searchBtn" title="Tìm kiếm">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16" y2="16"></line>
      </svg>
    </button>
  </div>

  <!-- DANH SÁCH BÀI HỌC -->
  <main id="mainContainer">
    <div id="sectionsContainer" class="sections-container"></div>
  </main>

  <!-- CHÂN TRANG ĐÁM MÂY & NÚT PLAY XANH LÁ -->
  <div class="cloud-footer" id="cloudFooter">
    <div class="cloud-wave"></div>
    <button type="button" class="floating-play-btn" id="quickPlayBtn" title="Học ngay">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="white">
        <path d="M8 5.14v14l11-7-11-7z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- MÀN HÌNH VÀO BÀI HỌC (MODAL - Tắt nhạc nền) -->
  <div class="stage-overlay" id="stageOverlay">
    <div class="stage-header">
      <button type="button" class="back-circle-btn sm" id="closeStageBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="stage-title" id="stageTitle">Bài học</div>
      <button type="button" class="btn-sm" id="replayStepBtn">🔁 Nghe lại</button>
    </div>
    <div class="stage-body" id="stageBody"></div>
    <div class="stage-footer">
      <button type="button" class="nav-btn" id="prevStepBtn">⬅ Trước</button>
      <div class="step-indicator" id="stepIndicator">1 / 1</div>
      <button type="button" class="nav-btn" id="nextStepBtn">Tiếp ➡</button>    
    </div>
        <!-- THANH 2 NÚT TRÒN THÔNG MINH (Ẩn khi đang viết, tự trượt lên khi xong chặng) -->
    <div class="smart-action-footer" id="smartActionFooter">
      <div class="smart-wave-bg"></div>
      <div class="smart-btn-row">
        <button type="button" class="smart-circle-btn replay" id="smartReplayBtn" title="Làm lại">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </button>
        <button type="button" class="smart-circle-btn next" id="smartNextBtn" title="Tiếp theo">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Các module JS -->
  <script src="js/media.js?v=20261115"></script>
  <script src="js/data-loader.js?v=20261115"></script>
  <script src="js/writing-board.js?v=20261115"></script>
  <script src="js/games-engine.js?v=20261115"></script>
  <script src="js/xaml-parser.js?v=20261115"></script>
  <script src="js/lesson-player.js?v=20261115"></script>
  <script src="js/main.js?v=20261115"></script>
  <script>
    // Tự động đồng bộ đúng môn học được chọn từ index.html (kể cả khi trình duyệt lưu cache main.js cũ)
    window.addEventListener('load', function () {
      var targetMod = '';
      try {
        var params = new URLSearchParams(window.location.search);
        targetMod = params.get('mod') || '';
      } catch (e) {}
      if (!targetMod && window.location.hash) {
        targetMod = window.location.hash.replace(/^#/, '').trim();
      }
      if (!targetMod) {
        try {
          targetMod = localStorage.getItem('APPTV_CURRENT_MOD') || '';
        } catch (e) {}
      }
      if (targetMod && ['data', 'write', 'thinking', 'games'].indexOf(targetMod) !== -1) {
        var btn = document.querySelector('.mode-pill[data-mod="' + targetMod + '"]');
        if (btn) btn.click();
      }
    });
  </script>
</body>
</html>
