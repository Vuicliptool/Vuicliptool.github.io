<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vuicliptool — Xem Phim & Tải Video Không Quảng Cáo</title>
    <style>
        :root {
            --bg: #0b0d12;
            --surface: #12151c;
            --surface-2: #1b1f29;
            --text: #f5f7fb;
            --text-secondary: #94a3b8;
            --accent: #dfef45;
            --accent-ink: #111500;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand {
            font-weight: bold;
            font-size: 18px;
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span.mark {
            background: var(--accent);
            color: var(--accent-ink);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        @media (min-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
        }
        .movie-card {
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            border: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .poster {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background-size: cover;
            background-position: center;
            background-color: var(--surface-2);
        }
        .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
        }
        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 6px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text);
        }
        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 15px;
        }

        /* Modal xem phim popup toàn màn hình */
        #playerModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal-header {
            position: absolute;
            top: 15px; right: 20px;
            display: flex; gap: 10px;
            z-index: 1001;
        }
        .control-btn {
            background: #333; color: #fff;
            border: none; padding: 8px 14px;
            font-size: 14px; font-weight: bold;
            border-radius: 4px; cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .control-btn.download { background: #10b981; }
        .control-btn.close { background: #ef4444; }
        
        .modal-content {
            position: relative;
            width: 100vw; height: 100vh;
            background: #000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content iframe {
            width: 100%; height: 100%; border: 0;
        }
        
        /* Logo nổi trên video */
        /* Logo nổi trên video */
.video-logo-overlay {
    position: absolute;
    top: 55px;   /* Tăng khoảng cách từ trên xuống để dịch xuống ngang vị trí logo Wind Studio */
    left: 15px;  /* Khoảng cách từ lề trái sang */
    width: 90px; /* Chỉnh độ rộng to hơn một chút để đủ che phủ logo cũ */
    height: auto;
    opacity: 0.95; /* Cho logo hiển thị rõ nét hoàn toàn */
    pointer-events: none;
    z-index: 99;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
}


        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            background: var(--surface);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<header>
    <a class="brand" href="#">
        <span class="mark">V</span> <strong>Vuicliptool</strong>
    </a>
    <span style="font-size: 13px; color: var(--accent);">Không Quảng Cáo</span>
</header>

<main class="container">
    <section>
        <h2>Danh Sách Phim Mới</h2>
        <div id="movieGrid" class="movie-grid">
            <div class="loading">Đang tải danh sách phim...</div>
        </div>
    </section>
</main>

<div id="playerModal">
    <div class="modal-header">
        <a id="downloadBtn" href="#" class="control-btn download" target="_blank">📥 Tải Về</a>
        <button class="control-btn" onclick="toggleFullScreen()">⛶ Phóng To</button>
        <button class="control-btn close" onclick="closePlayer()">Đóng ✕</button>
    </div>
    <div class="modal-content" id="modalContent">
        <img src="logo.svg" alt="Vuicliptool Logo" class="video-logo-overlay">
        
        <iframe id="videoIframe" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; fullscreen; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
</div>

<footer>
    <p>© 2026 Vuicliptool.github.io</p>
</footer>

<script>
    async function loadMovies() {
        try {
            let response = await fetch('movies.json');
            let movies = await response.json();
            
            let htmlContent = '';
            if (movies.length === 0) {
                document.getElementById('movieGrid').innerHTML = '<div class="loading">Chưa có phim nào.</div>';
                return;
            }

            movies.forEach(movie => {
                // Mã hóa dữ liệu để truyền an toàn vào hàm openPlayer
                let movieData = encodeURIComponent(JSON.stringify(movie));
                htmlContent += `
                    <article class="movie-card" onclick="openPlayer('${movieData}')">
                        <div class="poster" style="background-image:url('${movie.poster}')">
                            <span class="duration">${movie.duration}</span>
                        </div>
                        <div class="movie-info">
                            <h3 class="movie-title">${movie.title}</h3>
                        </div>
                    </article>
                `;
            });

            document.getElementById('movieGrid').innerHTML = htmlContent;
        } catch (error) {
            console.error(error);
            document.getElementById('movieGrid').innerHTML = '<div class="loading">Không thể tải dữ liệu từ movies.json</div>';
        }
    }

    loadMovies();

    function openPlayer(encodedMovie) {
        let movie = JSON.parse(decodeURIComponent(encodedMovie));
        
        // Gắn link phát video
        document.getElementById('videoIframe').src = movie.video;
        
        // Gắn link tải video
        document.getElementById('downloadBtn').href = movie.download || movie.video;
        
        // Mở khung phát
        document.getElementById('playerModal').style.display = 'flex';
    }

    function closePlayer() {
        document.getElementById('videoIframe').src = '';
        document.getElementById('playerModal').style.display = 'none';
    }

    function toggleFullScreen() {
        var elem = document.getElementById('modalContent');
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
        }
    }
</script>

</body>
</html>
