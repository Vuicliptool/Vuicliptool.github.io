<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bé Vui Học Tiếng Việt - Chọn Môn</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b7de9">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- THANH TIÊU ĐỀ TRANG CHỦ -->
  <header class="app-topbar">
    <button class="back-circle-btn" id="topBackBtn" title="Ẩn / Hiện menu">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <h1 class="topbar-title" id="topbarTitle">Bé Vui Học Tiếng Việt</h1>

    <div class="topbar-right">
      <button type="button" class="btn-sm" id="toggleBgmBtn" title="Bật/Tắt nhạc nền">🔊 Nhạc: Bật</button>

    </div>
  </header>

  <!-- THANH TÌM KIẾM -->
  <div class="search-section" id="searchSection">
    <input type="text" class="search-input" id="homeSearchInput" placeholder="🔍 Tìm kiếm bài học..." />
    <button class="search-circle-btn" id="homeSearchBtn" title="Tìm kiếm">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16" y2="16"></line>
      </svg>
    </button>
  </div>

  <!-- ĐOÀN TÀU CHỞ CHỮ CHẠY SINH ĐỘNG -->
  <div class="train-container">
    <div class="train-animation">
      🚂 🚃(A) 🚃(Ă) 🚃(Â) 🚃(B) 🚃(C) 🚃(Đ) 🚃(Ê) 🚃(O) 🚂💨 Chúc bé học giỏi! ✨
    </div>
    <div class="train-track"></div>
  </div>

  <!-- MENU CHỌN 4 PHẦN HỌC (Dùng thẻ <a> kết hợp JS để chuyển trang mượt trên mọi trình duyệt & Xem trước) -->
  <main class="menu-main-wrap">
    <nav class="mode-switcher vertical-menu" id="modeSwitcher">
      <a href="lessons.html?mod=data#data" class="mode-pill active" data-mod="data" onclick="return goToLessons(event, 'data')">
        <span>📖 Tập đọc</span> <span>➔</span>
      </a>
      <a href="lessons.html?mod=write#write" class="mode-pill" data-mod="write" onclick="return goToLessons(event, 'write')">
        <span>✍️ Tập viết chữ ô ly</span> <span>➔</span>
      </a>
      <a href="lessons.html?mod=thinking#thinking" class="mode-pill" data-mod="thinking" onclick="return goToLessons(event, 'thinking')">
        <span>🧠 Tư duy ngôn ngữ</span> <span>➔</span>
      </a>
      <a href="lessons.html?mod=games#games" class="mode-pill" data-mod="games" onclick="return goToLessons(event, 'games')">
        <span>🎮 Trò chơi</span> <span>➔</span>
      </a>
      
    </nav>
  </main>

  <!-- Các module JS -->
  <script src="js/media.js"></script>
  <script src="js/data-loader.js"></script>
  <script>
    function safeSetStorage(key, val) {
      try {
        if (window.localStorage) {
          window.localStorage.setItem(key, val);
        }
      } catch (e) {}
    }

    function goToLessons(e, mod) {
      safeSetStorage('APPTV_CURRENT_MOD', mod);
      var qInput = document.getElementById('homeSearchInput');
      var q = qInput ? (qInput.value || '').trim() : '';
      safeSetStorage('APPTV_SEARCH_Q', q);

      var targetUrl = 'lessons.html?mod=' + encodeURIComponent(mod);
      if (q) targetUrl += '&q=' + encodeURIComponent(q);
      targetUrl += '#' + encodeURIComponent(mod);

      if (e) e.preventDefault();
      window.location.href = targetUrl;
      return false;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var ns = window.AppTV || {};

      if (ns.DataLoader) {
        ns.DataLoader.loadAllTxtFiles(function () {});
      }

      var topBackBtn = document.getElementById('topBackBtn');
      if (topBackBtn) {
        topBackBtn.addEventListener('click', function () {
          if (ns.Media) ns.Media.playEffect('button');
          var switcher = document.getElementById('modeSwitcher');
          if (switcher) switcher.classList.toggle('collapsed');
        });
      }

      var homeSearchBtn = document.getElementById('homeSearchBtn');
      var homeSearchInput = document.getElementById('homeSearchInput');
      if (homeSearchBtn) {
        homeSearchBtn.addEventListener('click', function (e) {
          goToLessons(e, 'data');
        });
      }
      if (homeSearchInput) {
        homeSearchInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') goToLessons(e, 'data');
        });
      }

      var bgmBtn = document.getElementById('toggleBgmBtn');
      if (bgmBtn && ns.Media) {
        bgmBtn.addEventListener('click', function () {
          ns.Media.toggleBgm(bgmBtn, 'bg_home');
        });
      }

      var piggy = document.getElementById('txtFileInput');
      if (piggy && ns.DataLoader) {
        piggy.addEventListener('change', function (e) {
          ns.DataLoader.handleManualFileUpload(e.target.files, function () {
            alert('Đã nạp dữ liệu 4 file .txt thành công!');
          });
        });
      }

      if (ns.Media) {
        ns.Media.playBgm('bg_home');
      }
    });
  </script>
</body>
</html>
