<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="pageTitle">Vuicliptool — Xem Phim & Tải Video Không Quảng Cáo</title>
    
    <meta property="og:title" id="metaTitle" content="Vuicliptool — Xem Phim & Tải Video Không Quảng Cáo">
    <meta property="og:description" id="metaDesc" content="Xem phim không quảng cáo cùng Vuicliptool">
    <meta property="og:image" id="metaImage" content="logo.svg">
    <meta property="og:url" id="metaUrl" content="">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 18px;
        }
        .brand img { width: 32px; height: 32px; }
        .no-ads { font-size: 13px; color: #ffda79; background: rgba(255, 218, 121, 0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255, 218, 121, 0.3); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            width: 100%;
        }

        h2.section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff4757;
            padding-left: 10px;
        }

        /* Danh sách phim dạng lưới */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: rgba(255, 71, 87, 0.4);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a;
        }

        .movie-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .movie-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .watch-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Thống kê & Chân trang */
        .stats-footer {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 20px;
            text-align: center;
        }
        .stats-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.2s;
        }
        .social-btn:hover { background: rgba(255, 71, 87, 0.2); border-color: #ff4757; }
        
        .loading { text-align: center; padding: 40px; color: #888; font-size: 15px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <a class="brand" href="index.html">
            <img src="logo.svg" alt="Logo"> <strong>Vuicliptool</strong>
        </a>
        <div class="no-ads"><i class="fas fa-shield-alt"></i> Không Quảng Cáo</div>
    </header>

    <main class="container">
        <h2 class="section-title">Danh Sách Phim Mới</h2>
        
        <div id="moviesGrid" class="movies-grid">
            <div class="loading">Đang tải danh sách phim...</div>
        </div>
    </main>

    <footer class="stats-footer">
        <div class="stats-badges">
            <div class="badge"><i class="fas fa-eye" style="color: #ffda79;"></i> Tổng truy cập: <b>14.258</b></div>
            <div class="badge"><i class="fas fa-circle" style="color: #2ed573; font-size: 10px;"></i> Đang online: <b>14</b></div>
        </div>
        <p style="color: #666; font-size: 13px; margin-bottom: 15px;">Kết nối với chúng tôi</p>
        <div class="social-links">
            <a href="#" class="social-btn"><i class="fab fa-telegram-plane"></i></a>
            <a href="#" class="social-btn"><i class="fas fa-users"></i></a>
            <a href="#" class="social-btn"><i class="fab fa-youtube"></i></a>
        </div>
        <p style="color: #444; font-size: 12px; margin-top: 20px;">© 2026 Vuicliptool.github.io</p>
    </footer>

    <script>
        async function loadMovies() {
            try {
                let response = await fetch('movies.json');
                let movies = await response.json();
                let grid = document.getElementById('moviesGrid');
                
                if (!movies || movies.length === 0) {
                    grid.innerHTML = '<div class="loading">Chưa có phim nào trong danh sách.</div>';
                    return;
                }

                let html = '';
                movies.forEach(movie => {
                    // Trích xuất mã video ID từ link (ví dụ lấy đoạn xbdsgji)
                    let matchId = movie.video.match(/video\/([a-zA-Z0-9]+)/) || (movie.download && movie.download.match(/video\/([a-zA-Z0-9]+)/));
                    let videoId = matchId && matchId[1] ? matchId[1] : '';

                    // Đường dẫn khi bấm vào sẽ mở trang p.html kèm mã video
                    let targetUrl = videoId ? `p.html?v=${videoId}` : '#';

                    html += `
                        <div class="movie-card" onclick="window.location.href='${targetUrl}'">
                            <div class="movie-poster" style="background-image: url('${movie.poster || ''}')"></div>
                            <div class="movie-info">
                                <div class="movie-name">${movie.title || 'Phim mới'}</div>
                                <a href="${targetUrl}" class="watch-btn"><i class="fas fa-play"></i> Xem Ngay</a>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            } catch (error) {
                console.error("Lỗi tải danh sách phim:", error);
                document.getElementById('moviesGrid').innerHTML = '<div class="loading">Không thể tải dữ liệu danh sách phim.</div>';
            }
        }

        loadMovies();
    </script>
</body>
</html>
