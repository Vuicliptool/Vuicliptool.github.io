<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bé Học Tiếng Việt</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- MÀN HÌNH CHÍNH / CHỌN CHẾ ĐỘ (Drawer / Bar) -->
  <header class="app-topbar">
    <button class="back-circle-btn" id="topBackBtn" title="Đổi chuyên mục">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>

    <h1 class="topbar-title" id="topbarTitle">Tập viết chữ ô ly</h1>

    <div class="topbar-right">
      <label class="piggy-btn" title="Bấm để nạp 4 file .txt nếu cần">
        <span class="piggy-icon">🐖</span>
        <input type="file" id="txtFileInput" multiple accept=".txt,.json" style="display:none" />
      </label>
    </div>
  </header>

  <!-- MENU CHỌN NHANH 4 PHẦN HỌC (Hiện khi bấm nút mũi tên trái hoặc chọn nhanh) -->
  <nav class="mode-switcher" id="modeSwitcher">
    <button class="mode-pill active" data-mod="data" data-title="Tập đọc">📖 Tập đọc</button>
    <button class="mode-pill" data-mod="write" data-title="Tập viết chữ ô ly">✍️ Tập viết ô ly</button>
    <button class="mode-pill" data-mod="thinking" data-title="Tư duy ngôn ngữ">🧠 Tư duy ngôn ngữ</button>
    <button class="mode-pill" data-mod="games" data-title="Trò chơi">🎮 Trò chơi</button>
    <button class="mode-pill sound-pill" id="toggleBgmBtn">🔇 Nhạc</button>
  </nav>

  <!-- THANH TÌM KIẾM (Tự động ẩn ở mục Tư duy ngôn ngữ giống ảnh mẫu) -->
  <div class="search-section" id="searchSection">
    <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm" />
    <button class="search-circle-btn" id="searchBtn" title="Tìm kiếm">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="20" y1="20" x2="16" y2="16"></line>
      </svg>
    </button>
  </div>

  <!-- DANH SÁCH KHUNG CHỦ ĐỀ & BÀI HỌC (Cuộn dọc theo từng khung ruy-băng vàng) -->
  <main id="mainContainer">
    <div id="sectionsContainer" class="sections-container"></div>
  </main>

  <!-- CHÂN TRANG ĐÁM MÂY & NÚT PLAY XANH LÁ -->
  <div class="cloud-footer" id="cloudFooter">
    <div class="cloud-wave"></div>
    <button class="floating-play-btn" id="quickPlayBtn" title="Học ngay">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="white">
        <path d="M8 5.14v14l11-7-11-7z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- MÀN HÌNH HỌC / CHƠI (MODAL) -->
  <div class="stage-overlay" id="stageOverlay">
    <div class="stage-header">
      <button class="back-circle-btn sm" id="closeStageBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="stage-title" id="stageTitle">Bài học</div>
      <button class="btn-sm" id="replayStepBtn">🔁 Nghe lại</button>
    </div>
    <div class="stage-body" id="stageBody"></div>
    <div class="stage-footer">
      <button class="nav-btn" id="prevStepBtn">⬅ Trước</button>
      <div class="step-indicator" id="stepIndicator">1 / 1</div>
      <button class="nav-btn" id="nextStepBtn">Tiếp ➡</button>
    </div>
  </div>

  <!-- Các module JS -->
  <script src="js/media.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/writing-board.js"></script>
<script src="js/games-engine.js"></script>
<script src="js/xaml-parser.js"></script> <!-- Dòng này -->
<script src="js/lesson-player.js"></script>
<script src="js/main.js"></script>

</body>
</html>
