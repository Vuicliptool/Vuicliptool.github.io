        </div>
    </section>

    <!-- KHU VỰC 3: KHO PHIM BỘ -->
    <section id="seriesSection">
        <h2 style="border-top: 1px solid #333; padding-top: 20px;">Kho Phim Bộ</h2>
        <div id="seriesGrid" class="movie-grid">
            <div class="loading">Đang tải phim bộ...</div>
        </div>
        <div id="seriesMoreBtnContainer" style="text-align: center; margin-top: 15px; display: none;">
            <button onclick="toggleShowAll('series')" style="background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600;">Xem thêm phim bộ ▼</button>

<!-- MODAL CHỌN TẬP PHIM BỘ -->

    <div style="background:#1a1a1a; width:90%; max-width:500px; border-radius:12px; padding:20px; border:1px solid #333; max-height:80vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
            <h3 id="seriesModalTitle" style="color:#fff; font-size:18px; margin:0;">Chọn Tập Phim</h3>
            <button onclick="closeSeriesModal()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div id="episodeListGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:10px;"></div>
    </div>
</div>

<!-- JAVASCRIPT INDEX -->
<script>
    let allMoviesData = [];
    let allSingleMovies = [];
    let allSeriesMovies = [];
    let showAllSingle = false;
    let showAllSeries = false;

    async function loadMovies() {
        try {
            let response = await fetch('movies.txt');
            let movies = await response.json();
            allMoviesData = movies;
            if (movies.length === 0) return;
            processMoviesData(movies);
        } catch (error) {
            console.error("Lỗi tải file movies.txt:", error);
        }
    }

    function processMoviesData(movies) {
        let tempGroup = {};
        movies.forEach(movie => {
            let key = movie.series || movie.title;
            if (!tempGroup[key]) tempGroup[key] = [];
            tempGroup[key].push(movie);
        });

        allSingleMovies = [];
        let groupedSeries = {};

        movies.forEach(movie => {
            let key = movie.series || movie.title;
            if (tempGroup[key].length === 1) {
                allSingleMovies.push(movie);
            } else {
                if (!groupedSeries[key]) {
                    groupedSeries[key] = { title: key, poster: movie.poster, episodes: tempGroup[key] };
                }
            }
        });

        allSeriesMovies = Object.values(groupedSeries);
        renderLatestMovies(movies.slice(0, 10), tempGroup, movies);
        renderSingleMovies(movies);
        renderSeriesMovies();
    }

    function handleSearch() {
        let keyword = document.getElementById('searchInput').value.toLowerCase().trim();
        if (keyword === "") {
            document.getElementById('latestSection').style.display = 'block';
            document.getElementById('singleSection').style.display = 'block';
            document.getElementById('seriesSection').style.display = 'block';
            processMoviesData(allMoviesData);
            return;
        }

        document.getElementById('latestSection').style.display = 'none';
        document.getElementById('singleSection').style.display = 'block';
        document.getElementById('seriesSection').style.display = 'none';
        document.getElementById('singleMoreBtnContainer').style.display = 'none';

        let searchHtml = '';

        // [ĐÃ SỬA]: Tính toán chuyển ID ngược lại (Phim cũ nhất ID=0, mới nhất ID lớn nhất)
        allMoviesData.forEach((movie, index) => {
            if (movie.title.toLowerCase().includes(keyword)) {
                let isSeries = !!movie.series;
                let label = isSeries ? (movie.episode || 'Tập') : 'Phim Lẻ';
                
                // Công thức quy đổi ID: tổng số phim - 1 - vị trí index thật
                let fixedId = allMoviesData.length - 1 - index;
                let watchUrl = `watch.html?id=${fixedId}`;

                searchHtml += `
                    <article class="movie-card" onclick="window.location.href='${watchUrl}'">
                        <div class="poster" style="background-image:url('${movie.poster}')">
                            <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuiclip.mobie.in</div>
                            <span class="duration">${label}</span>
                        </div>
                        <div class="movie-info"><h3 class="movie-title">${movie.title}</h3></div>
                    </article>
                `;
            }
        });

        document.querySelector('#singleSection h2').innerText = `Kết quả tìm kiếm cho: "${keyword}"`;
        document.getElementById('singleGrid').innerHTML = searchHtml === '' ? '<div class="loading" style="grid-column: 1/-1;">Không tìm thấy phim phù hợp!</div>' : searchHtml;
    }

    function renderLatestMovies(latestMovies, tempGroup, fullMovies) {
        let latestHtml = '';
    latestMovies.forEach(movie => {
            let realIndex = fullMovies.findIndex(m => m === movie);
            let key = movie.series || movie.title;
            let isSeries = tempGroup[key] && tempGroup[key].length > 1;
            let label = isSeries ? (movie.episode || 'Tập') : 'Phim Lẻ';
        
            if (isSeries) {
                let group = { title: key, poster: movie.poster, episodes: tempGroup[key] };
                let groupData = encodeURIComponent(JSON.stringify(group));
                latestHtml += `
                    <article class="movie-card" onclick="openSeriesModal('${groupData}')">
                        <div class="poster" style="background-image:url('${movie.poster}')">
                            <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuiclip.mobie.in</div>
                            <span class="duration">${label}</span>
                        </div>
                        <div class="movie-info"><h3 class="movie-title">${movie.title}</h3></div>
                    </article>
                `;
            } else {
                let fixedId = fullMovies.length - 1 - realIndex;
                let watchUrl = `watch.html?id=${fixedId}`;
                latestHtml += `
                    <article class="movie-card" onclick="window.location.href='${watchUrl}'">
                        <div class="poster" style="background-image:url('${movie.poster}')">
                            <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuiclip.mobie.in</div>
                            <span class="duration">${label}</span>
                        </div>
                        <div class="movie-info"><h3 class="movie-title">${movie.title}</h3></div>
                    </article>
                `;
            }
        });
        document.getElementById('movieGrid').innerHTML = latestHtml;
    }


    function renderSingleMovies(fullMovies) {
        document.querySelector('#singleSection h2').innerText = 'Kho Phim Lẻ';
        let singleGrid = document.getElementById('singleGrid');
        let btnContainer = document.getElementById('singleMoreBtnContainer');
        if (allSingleMovies.length === 0) {
            singleGrid.innerHTML = '<div class="loading" style="grid-column: 1/-1;">Chưa có phim lẻ nào.</div>';
            btnContainer.style.display = 'none';
            return;
        }

        let displayedMovies = showAllSingle ? allSingleMovies : allSingleMovies.slice(0, 10);
        let singleHtml = '';
        displayedMovies.forEach(movie => {
            let realIndex = allMoviesData.findIndex(m => m === movie);
            
            // [ĐÃ SỬA]: Quy đổi ID cho kho phim lẻ
            let fixedId = allMoviesData.length - 1 - realIndex;
            let watchUrl = `watch.html?id=${fixedId}`;

            singleHtml += `
                <article class="movie-card" onclick="window.location.href='${watchUrl}'">
                    <div class="poster" style="background-image:url('${movie.poster}')">
                        <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuiclip.mobie.in</div>
                        <span class="duration">Full HD</span>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Phim Lẻ</p>
                    </div>
                </article>
            `;
        });
        singleGrid.innerHTML = singleHtml;
        btnContainer.style.display = allSingleMovies.length > 10 ? 'block' : 'none';
        if(btnContainer.style.display === 'block') {
            btnContainer.querySelector('button').innerText = showAllSingle ? 'Thu gọn ▲' : 'Xem thêm phim lẻ ▼';
        }
    }

    function renderSeriesMovies() {
        let seriesGrid = document.getElementById('seriesGrid');
        let btnContainer = document.getElementById('seriesMoreBtnContainer');
        if (allSeriesMovies.length === 0) {
            seriesGrid.innerHTML = '<div class="loading" style="grid-column: 1/-1;">Chưa có phim bộ nào.</div>';
            btnContainer.style.display = 'none';
            return;
        }

        let displayedSeries = showAllSeries ? allSeriesMovies : allSeriesMovies.slice(0, 10);
        let seriesHtml = '';
        displayedSeries.forEach(group => {
            let groupData = encodeURIComponent(JSON.stringify(group));
            let totalEp = group.episodes.length;
            seriesHtml += `
                <article class="movie-card" onclick="openSeriesModal('${groupData}')">
                    <div class="poster" style="background-image:url('${group.poster}')">
                        <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuiclip.mobie.in</div>
                        <span class="duration">${totalEp} Tập</span>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${group.title}</h3>
                        <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Phim bộ (${totalEp} tập)</p>
                    </div>
                </article>
            `;
        });
        seriesGrid.innerHTML = seriesHtml;
        btnContainer.style.display = allSeriesMovies.length > 10 ? 'block' : 'none';
        if(btnContainer.style.display === 'block') {
            btnContainer.querySelector('button').innerText = showAllSeries ? 'Thu gọn ▲' : 'Xem thêm phim bộ ▼';
        }
    }

    function toggleShowAll(type) {
        if (type === 'single') { showAllSingle = !showAllSingle; renderSingleMovies(allMoviesData); }
        else if (type === 'series') { showAllSeries = !showAllSeries; renderSeriesMovies(); }
    }

    function openSeriesModal(encodedGroup) {
        let group = JSON.parse(decodeURIComponent(encodedGroup));
        if (group.episodes.length === 1) {
            let ep = group.episodes[0];
            let realIndex = allMoviesData.findIndex(m => m.video === ep.video);
            
            // [ĐÃ SỬA]: Quy đổi ID khi phim bộ chỉ có 1 tập
            let fixedId = allMoviesData.length - 1 - realIndex;
            window.location.href = `watch.html?id=${fixedId}`;
            return;
        }
        document.getElementById('seriesModalTitle').innerText = group.title;
        let epHtml = '';
        group.episodes.forEach(ep => {
            let realIndex = allMoviesData.findIndex(m => m.video === ep.video);
            
            // [ĐÃ SỬA]: Quy đổi ID cho từng tập phim trong Modal phim bộ
            let fixedId = allMoviesData.length - 1 - realIndex;
            let watchUrl = `watch.html?id=${fixedId}`;
            
            epHtml += `<button onclick="window.location.href='${watchUrl}'" style="background:#2a2a2a; color:#fff; border:1px solid #444; padding:10px; border-radius:6px; cursor:pointer; font-weight:600; text-align:center;">${ep.episode || "Tập"}</button>`;
        });
        document.getElementById('episodeListGrid').innerHTML = epHtml;
        document.getElementById('seriesModal').style.display = 'flex';
    }

    function closeSeriesModal() { 
        document.getElementById('seriesModal').style.display = 'none'; 
    }

    function initStats() {
        let visits = localStorage.getItem('vuiclip_total_visits');
        visits = visits ? parseInt(visits) : 14250;
        if (!sessionStorage.getItem('counted_session')) {
            visits += 1;
            localStorage.setItem('vuiclip_total_visits', visits);
            sessionStorage.setItem('counted_session', 'true');
        }
        document.getElementById('totalVisits').innerText = visits.toLocaleString('vi-VN');
        document.getElementById('onlineUsers').innerText = Math.floor(Math.random() * 15) + 12;
    }
    
    initStats();
    loadMovies();
</script>
