            <div class="loading">Đang tải danh sách phim...</div>
        </div>

</main>

<div id="playerModal">
    <div class="modal-header">
        <button class="control-btn share" onclick="shareMovie()"><i class="fas fa-link"></i> Chia Sẻ</button>
        <button class="control-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> Phóng To</button>
        <button class="control-btn close" onclick="closePlayer()">Đóng ✕</button>
    </div>
    <div class="modal-content" id="modalContent">
        <img src="logo.svg" alt="Vuicliptool Logo" class="video-logo-overlay">
        
        <div class="video-overlay-banner">Xem phim không quảng cáo tại vuicliptool.github.io</div>

        <iframe id="videoIframe" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; fullscreen; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
</div>

<footer>
    <div class="footer-stats">

        </div>
        <div class="stat-item">
            <span>🟢 Đang online:</span> <strong id="onlineUsers">--</strong>
        </div>
    </div>

    <div class="social-section">

        <div class="social-pentagon">
            <div style="text-align: center;">
                <a href="https://t.me/vuiclip_tool_termux" target="_blank" class="social-btn telegram" title="Telegram">

            </div>
            <div style="text-align: center;">
                <a href="https://zalo.me/g/gidiwv418" target="_blank" class="social-btn group-zalo" title="Group Zalo">
                    <i class="fas fa-users"></i>
                </a>
                <span class="social-label">Group Zalo</span>
            </div>
            <div style="text-align: center;">
                <a href="https://youtube.com/@vuiclip-tool-termux4228" target="_blank" class="social-btn youtube" title="YouTube">
                    <i class="fab fa-youtube"></i>

    <div style="display: flex; justify-content: center; align-items: center; margin: 15px 0;">
        <div id="histats_counter"></div>

        _Hasync.push(['Histats.track_hits', '']);
        (function() {
        var hs = document.createElement('script'); hs.type = 'text/javascript'; hs.async = true;
        hs.src = ('//s10.histats.com/js15_as.js');
        (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(hs);
        })();</script>

    </div>

<script>
    let currentMovie = null;

    async function loadMovies() {
        try {
            let response = await fetch('movies.json');
            let movies = await response.json();
            
            let htmlContent = '';
            if (movies.length === 0) {
                document.getElementById('movieGrid').innerHTML = '<div class="loading">Chưa có phim nào.</div>';
                return;
            }

            movies.forEach(movie => {
                let movieData = encodeURIComponent(JSON.stringify(movie));
                htmlContent += `
                    <article class="movie-card" onclick="openPlayer('${movieData}')">
                        <div class="poster" style="background-image:url('${movie.poster}')">
                            <div class="poster-overlay-banner">Xem phim không quảng cáo tại vuicliptool.github.io</div>
                            <span class="duration">${movie.duration}</span>
                        </div>
                        <div class="movie-info">
                            <h3 class="movie-title">${movie.title}</h3>
                        </div>
                    </article>
                `;
            });

            document.getElementById('movieGrid').innerHTML = htmlContent;

            // Xử lý tự động mở phim chuẩn xác khi có tham số ?v= trên URL
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('v');
            
            if (videoId) {
                let found = movies.find(m => m.video.includes(videoId) || m.download.includes(videoId));
                if (found) {
                    currentMovie = found;
                    document.getElementById('videoIframe').src = found.video;
                    document.getElementById('playerModal').style.display = 'flex';
                    
                    // Cập nhật thẻ Meta Open Graph khi load qua tham số ?v=
                    let fullPosterUrl = found.poster.startsWith('http') ? found.poster : window.location.origin + '/' + found.poster;
                    document.getElementById('metaTitle').setAttribute('content', `Xem phim: ${found.title} - Vuicliptool`);
                    document.getElementById('metaDesc').setAttribute('content', `Thưởng thức phim ${found.title} cực hay, không quảng cáo.`);
                    document.getElementById('metaImage').setAttribute('content', fullPosterUrl);
                    document.getElementById('metaUrl').setAttribute('content', window.location.href);
                    document.getElementById('pageTitle').innerText = `Xem phim: ${found.title}`;
                }
            }

        } catch (error) {
            console.error(error);
            document.getElementById('movieGrid').innerHTML = '<div class="loading">Không thể tải dữ liệu từ movies.json</div>';
        }
    }

    loadMovies();

    function initStats() {
        let visits = localStorage.getItem('vuiclip_total_visits');
        visits = visits ? parseInt(visits) : 14250;
        
        if (!sessionStorage.getItem('counted_session')) {
            visits += 1;
            localStorage.setItem('vuiclip_total_visits', visits);
            sessionStorage.setItem('counted_session', 'true');
        }
        
        document.getElementById('totalVisits').innerText = visits.toLocaleString('vi-VN');

        let baseOnline = Math.floor(Math.random() * 15) + 12;
        document.getElementById('onlineUsers').innerText = baseOnline;

        setInterval(() => {
            let fluctuation = Math.floor(Math.random() * 5) - 2;
            baseOnline = Math.max(8, baseOnline + fluctuation);
            document.getElementById('onlineUsers').innerText = baseOnline;
        }, 15000);
    }

    initStats();

    function openPlayer(encodedMovie) {
        let movie = JSON.parse(decodeURIComponent(encodedMovie));
        currentMovie = movie;
    
        document.getElementById('videoIframe').src = movie.video;
        document.getElementById('playerModal').style.display = 'flex';
    
        // Cập nhật thẻ Meta Open Graph khi click mở phim
        let currentUrl = window.location.href;
        let fullPosterUrl = movie.poster.startsWith('http') ? movie.poster : window.location.origin + '/' + movie.poster;

        document.getElementById('metaTitle').setAttribute('content', `Xem phim: ${movie.title} - Vuicliptool`);
        document.getElementById('metaDesc').setAttribute('content', `Thưởng thức phim ${movie.title} cực hay, không quảng cáo.`);
        document.getElementById('metaImage').setAttribute('content', fullPosterUrl);
        document.getElementById('metaUrl').setAttribute('content', currentUrl);
        document.getElementById('pageTitle').innerText = `Xem phim: ${movie.title}`;

        let match = movie.download.match(/video\/([a-zA-Z0-9]+)/) || movie.video.match(/video\/([a-zA-Z0-9]+)/);
        if (match && match[1]) {
            window.history.replaceState(null, '', `?v=${match[1]}`);
        }
    }

    function closePlayer() {
        document.getElementById('videoIframe').src = '';
        document.getElementById('playerModal').style.display = 'none';
        window.history.replaceState(null, '', window.location.pathname);
    
        // Reset lại meta về mặc định khi đóng popup
        document.getElementById('metaTitle').setAttribute('content', 'Vuicliptool — Xem Phim & Tải Video Không Quảng Cáo');
        document.getElementById('metaDesc').setAttribute('content', 'Xem phim không quảng cáo cùng Vuicliptool');
        document.getElementById('metaImage').setAttribute('content', window.location.origin + '/logo.svg');
        document.getElementById('metaUrl').setAttribute('content', window.location.origin + window.location.pathname);
        document.getElementById('pageTitle').innerText = 'Vuicliptool — Xem Phim & Tải Video Không Quảng Cáo';
    }

    function shareMovie() {
        if (!currentMovie) return;

        // Lấy mã video ID từ link download hoặc video để tạo link chia sẻ qua p.html
        let match = currentMovie.download.match(/video\/([a-zA-Z0-9]+)/) || currentMovie.video.match(/video\/([a-zA-Z0-9]+)/);
        let videoId = match && match[1] ? match[1] : '';

        // Trỏ link chia sẻ đi qua p.html để Facebook nhận diện đúng ảnh thumbnail
        let shareUrl = `${window.location.origin}/p.html?v=${videoId}`;
        let shareText = `Xem ngay phim "${currentMovie.title}" không quảng cáo tại đây:`;

        if (navigator.share) {
            navigator.share({
                title: currentMovie.title,
                text: shareText,
                url: shareUrl,
            }).catch((error) => console.log('Chia sẻ bị hủy', error));
        } else {
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("Đã sao chép link chia sẻ phim vào bộ nhớ tạm!");
            }).catch(err => {
                console.error('Không thể copy link: ', err);
            });
        }
    }

    function toggleFullScreen() {
        var elem = document.getElementById('modalContent');
        if (!document.fullscreenElement) {
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
        }
    }
</script>

</body>
</html>
