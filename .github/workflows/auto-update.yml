name: Auto Update Movies

on:
  schedule:
    - cron: '0 */6 * * *' # Tự động chạy quét mới mỗi 6 tiếng một lần
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất cứ lúc nào trên giao diện GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push if movies.json changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update movies.json via GitHub Actions"
          file_pattern: movies.json
